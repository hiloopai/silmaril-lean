# The C translation-validation rows (docs/projects/c-tv.md), a child of the root group in
# `silmaril/selftest.toml`. Solved in examples/c-tv/CTvRows.lean (verdicts computed by `cbv`).
schema = "silmaril.records.v0.2"

[[group]]
name = "silmaril.c_tv.all"
title = "C translation validation: Core-to-Core rows and the per-type coherence of the x86-64 profile"
children = ["silmaril.c_tv.examples", "silmaril.c_tv.profile.linux_x86_64"]

[[group]]
name = "silmaril.c_tv.examples"
title = "Core-to-Core rows over elaborated `return a + b;` programs (no compiler-origin claim)"
children = ["silmaril.c_tv.examples.fold.refines", "silmaril.c_tv.examples.fold.refines_ub_free",
  "silmaril.c_tv.examples.fold.equivalent", "silmaril.c_tv.examples.wrong_fold.refines",
  "silmaril.c_tv.examples.overflow.refines", "silmaril.c_tv.examples.overflow.refines_ub_free",
  "silmaril.c_tv.examples.fold.applies", "silmaril.c_tv.examples.fold.refines_on",
  "silmaril.c_tv.examples.float_signature.applies", "silmaril.c_tv.examples.main_fold.context_refines",
  "silmaril.c_tv.examples.two_functions.module_refines", "silmaril.c_tv.examples.two_functions_wrong.module_refines"]

[[instance]]
name = "silmaril.c_tv.examples.fold.refines"
of = "silmaril.shapes.c.tv.refines"
args = { impl = "Silmaril.Cerberus.Spec.Impl.lp64", src = "Silmaril.Project.CTV.Examples.foldSource", tgt = "Silmaril.Project.CTV.Examples.foldTarget" }
expect = "THM"
title = "return 3 + 0; refines return 1 + 2; (Core to Core)"

[[instance]]
name = "silmaril.c_tv.examples.fold.refines_ub_free"
of = "silmaril.shapes.c.tv.refines_ub_free"
args = { impl = "Silmaril.Cerberus.Spec.Impl.lp64", src = "Silmaril.Project.CTV.Examples.foldSource", tgt = "Silmaril.Project.CTV.Examples.foldTarget" }
expect = "THM"
title = "... and the source has no undefined behaviour"

[[instance]]
name = "silmaril.c_tv.examples.fold.equivalent"
of = "silmaril.shapes.c.tv.equivalent"
args = { impl = "Silmaril.Cerberus.Spec.Impl.lp64", P = "Silmaril.Project.CTV.Examples.foldSource", Q = "Silmaril.Project.CTV.Examples.foldTarget" }
expect = "THM"
title = "return 1 + 2; and return 3 + 0; are equivalent (Core)"

[[instance]]
name = "silmaril.c_tv.examples.wrong_fold.refines"
of = "silmaril.shapes.c.tv.refines"
args = { impl = "Silmaril.Cerberus.Spec.Impl.lp64", src = "Silmaril.Project.CTV.Examples.foldSource", tgt = "Silmaril.Project.CTV.Examples.wrongFoldTarget" }
expect = "UNS"
title = "return 2 + 2; does not refine return 1 + 2;"

[[instance]]
name = "silmaril.c_tv.examples.overflow.refines"
of = "silmaril.shapes.c.tv.refines"
args = { impl = "Silmaril.Cerberus.Spec.Impl.lp64", src = "Silmaril.Project.CTV.Examples.overflow", tgt = "Silmaril.Project.CTV.Examples.overflowTarget" }
expect = "THM"
title = "anything refines INT_MAX + 1 (only through source undefined behaviour)"

[[instance]]
name = "silmaril.c_tv.examples.overflow.refines_ub_free"
of = "silmaril.shapes.c.tv.refines_ub_free"
args = { impl = "Silmaril.Cerberus.Spec.Impl.lp64", src = "Silmaril.Project.CTV.Examples.overflow", tgt = "Silmaril.Project.CTV.Examples.overflowTarget" }
expect = "UNS"
title = "the INT_MAX + 1 row is not UB-free: it is not counted as a defined-source validation"

[[instance]]
name = "silmaril.c_tv.examples.fold.applies"
of = "silmaril.shapes.c.tv.profile_applies"
args = { p = "Silmaril.Project.Shapes.CTV.linuxX86_64", b = "Silmaril.Project.CTV.Examples.foldSourceBindings" }
expect = "THM"
title = "the x86-64 per-type check passes on return 1 + 2; (its reachable Core names _Bool and int only)"

[[instance]]
name = "silmaril.c_tv.examples.fold.refines_on"
of = "silmaril.shapes.c.tv.refines_on"
args = { p = "Silmaril.Project.Shapes.CTV.linuxX86_64", src = "Silmaril.Project.CTV.Examples.foldSourceBindings", tgt = "Silmaril.Project.CTV.Examples.foldTargetBindings" }
expect = "THM"
title = "the fold refines (Core), and the x86-64 per-type check passes on both (a necessary filter, not a target statement)"

[[instance]]
name = "silmaril.c_tv.examples.float_signature.applies"
of = "silmaril.shapes.c.tv.profile_applies"
args = { p = "Silmaril.Project.Shapes.CTV.linuxX86_64", b = "Silmaril.Project.CTV.Examples.floatSignatureBindings" }
expect = "UNS"
title = "the x86-64 per-type check fails on a (synthetic) file whose Core names float"

[[instance]]
name = "silmaril.c_tv.examples.main_fold.context_refines"
of = "silmaril.shapes.c.tv.context_refines"
args = { impl = "Silmaril.Cerberus.Spec.Impl.lp64", ctxs = "Silmaril.Project.CTV.Examples.mainContexts", f = "Silmaril.Project.CTV.Examples.mainSym", before = "Silmaril.Project.CTV.Examples.mainFoldBefore", after = "Silmaril.Project.CTV.Examples.mainFoldAfter" }
expect = "THM"
title = "replacing main's Core (return 1 + 2;) by that of return 3 + 0; refines the program, in the listed context (function level)"

[[instance]]
name = "silmaril.c_tv.examples.two_functions.module_refines"
of = "silmaril.shapes.c.tv.module_refines"
args = { impl = "Silmaril.Cerberus.Spec.Impl.lp64", ctxs = "Silmaril.Project.CTV.Examples.twoContexts", rs = "Silmaril.Project.CTV.Examples.twoReplacements" }
expect = "THM"
title = "replacing id (return x; by return 42;) and main (return id(42); by return id(40 + 2);) refines, in the listed context (id := return 42 is right only because main calls id(42))"

[[instance]]
name = "silmaril.c_tv.examples.two_functions_wrong.module_refines"
of = "silmaril.shapes.c.tv.module_refines"
args = { impl = "Silmaril.Cerberus.Spec.Impl.lp64", ctxs = "Silmaril.Project.CTV.Examples.twoContexts", rs = "Silmaril.Project.CTV.Examples.twoWrongReplacements" }
expect = "UNS"
title = "replacing id by return 41; does not refine (main returns id(42))"

