# Basic-block CFGs of example Wasm functions, built by `Silmaril.Wasm.Cfg.blockCfg` (which realizes
# the declarative relation `Silmaril.Wasm.Cfg.Edge`), with the effect edges of
# `Silmaril.Wasm.Cfg.EffectEdge`, written as machine documents by
# `ProjectSelfTest.WasmBlockCfg.blockDoc`. The `*_blocks` theorems there prove that each document
# has exactly these nodes and edges. These graphs are syntactic and incomplete: no theorem says
# that executions follow them.
schema = "silmaril.records.v0.2"

[[machine]]
name = "silmaril.wasm.blockcfg.verified.sum"
doc = "Syntactic block CFG — incomplete, not an execution model: flow edges follow structured control, effect edges mark possible traps and raises; no theorem says executions follow this graph. `sum` (Examples.Verified.prog): the loop body splits at br_if 1 (leaves the block) and br 0 (back to the loop head)."
states = ["exit", "trap", "raise", "invalid", "b0 [].0: 0 instrs → block", "b1 [0/0].0: 0 instrs → loop", "b2 [0/0.0/0].0: 3 instrs → br_if 1", "b3 [0/0.0/0].1: 8 instrs → br 0", "b4 [].1: 1 instrs → falls through"]
labels = ["flow", "effect"]
edges = [
  ["b0 [].0: 0 instrs → block", "flow", "b1 [0/0].0: 0 instrs → loop"],
  ["b1 [0/0].0: 0 instrs → loop", "flow", "b2 [0/0.0/0].0: 3 instrs → br_if 1"],
  ["b2 [0/0.0/0].0: 3 instrs → br_if 1", "flow", "b4 [].1: 1 instrs → falls through"],
  ["b2 [0/0.0/0].0: 3 instrs → br_if 1", "flow", "b3 [0/0.0/0].1: 8 instrs → br 0"],
  ["b3 [0/0.0/0].1: 8 instrs → br 0", "flow", "b2 [0/0.0/0].0: 3 instrs → br_if 1"],
  ["b4 [].1: 1 instrs → falls through", "flow", "exit"],
]
initial = ["b0 [].0: 0 instrs → block"]
accepting = ["exit"]
rejecting = []
error = ["trap", "raise", "invalid"]

[[machine]]
name = "silmaril.wasm.blockcfg.dispatch"
doc = "Syntactic block CFG — incomplete, not an execution model: flow edges follow structured control, effect edges mark possible traps and raises; no theorem says executions follow this graph. A br_table dispatcher over three nested blocks (Wasm.Cfg.Examples.mod): one flow edge per br_table target."
states = ["exit", "trap", "raise", "invalid", "b0 [].0: 0 instrs → block", "b1 [0/0].0: 0 instrs → block", "b2 [0/0.0/0].0: 0 instrs → block", "b3 [0/0.0/0.0/0].0: 1 instrs → br_table [0, 1] 2", "b4 [0/0.0/0].1: 1 instrs → return", "b5 [0/0].1: 1 instrs → return", "b6 [].1: 1 instrs → falls through"]
labels = ["flow", "effect"]
edges = [
  ["b0 [].0: 0 instrs → block", "flow", "b1 [0/0].0: 0 instrs → block"],
  ["b1 [0/0].0: 0 instrs → block", "flow", "b2 [0/0.0/0].0: 0 instrs → block"],
  ["b2 [0/0.0/0].0: 0 instrs → block", "flow", "b3 [0/0.0/0.0/0].0: 1 instrs → br_table [0, 1] 2"],
  ["b3 [0/0.0/0.0/0].0: 1 instrs → br_table [0, 1] 2", "flow", "b4 [0/0.0/0].1: 1 instrs → return"],
  ["b3 [0/0.0/0.0/0].0: 1 instrs → br_table [0, 1] 2", "flow", "b5 [0/0].1: 1 instrs → return"],
  ["b3 [0/0.0/0.0/0].0: 1 instrs → br_table [0, 1] 2", "flow", "b6 [].1: 1 instrs → falls through"],
  ["b4 [0/0.0/0].1: 1 instrs → return", "flow", "exit"],
  ["b5 [0/0].1: 1 instrs → return", "flow", "exit"],
  ["b6 [].1: 1 instrs → falls through", "flow", "exit"],
]
initial = ["b0 [].0: 0 instrs → block"]
accepting = ["exit"]
rejecting = []
error = ["trap", "raise", "invalid"]

[[machine]]
name = "silmaril.wasm.blockcfg.specials"
doc = "Syntactic block CFG — incomplete, not an execution model: flow edges follow structured control, effect edges mark possible traps and raises; no theorem says executions follow this graph. Flow edges to trap (unreachable), raise (throw) and exit (return). No block branches to a missing label here, so `invalid` is unreachable (see Examples.badBranch)."
states = ["exit", "trap", "raise", "invalid", "b0 [].0: 1 instrs → if", "b1 [0/0].0: 0 instrs → unreachable", "b2 [].1: 2 instrs → if", "b3 [1/0].0: 0 instrs → throw 0", "b4 [].2: 0 instrs → return"]
labels = ["flow", "effect"]
edges = [
  ["b0 [].0: 1 instrs → if", "flow", "b1 [0/0].0: 0 instrs → unreachable"],
  ["b0 [].0: 1 instrs → if", "flow", "b2 [].1: 2 instrs → if"],
  ["b1 [0/0].0: 0 instrs → unreachable", "flow", "trap"],
  ["b2 [].1: 2 instrs → if", "flow", "b3 [1/0].0: 0 instrs → throw 0"],
  ["b2 [].1: 2 instrs → if", "flow", "b4 [].2: 0 instrs → return"],
  ["b3 [1/0].0: 0 instrs → throw 0", "flow", "raise"],
  ["b4 [].2: 0 instrs → return", "flow", "exit"],
]
initial = ["b0 [].0: 1 instrs → if"]
accepting = ["exit"]
rejecting = []
error = ["trap", "raise", "invalid"]

