states = ["exit", "trap", "raise", "invalid", "b0 [].0: 0 instrs → block", "b1 [0/0].0: 0 instrs → try_table", "b2 [0/0.0/0].0: 6 instrs → if {may trap, call, handler unresolved}", "b3 [0/0.0/0.0/0].0: 0 instrs → throw 0 {handler unresolved}", "b4 [].1: 2 instrs → falls through {may trap}"]
labels = ["flow", "effect"]
edges = [
  ["b0 [].0: 0 instrs → block", "flow", "b1 [0/0].0: 0 instrs → try_table"],
  ["b1 [0/0].0: 0 instrs → try_table", "flow", "b2 [0/0.0/0].0: 6 instrs → if {may trap, call, handler unresolved}"],
  ["b1 [0/0].0: 0 instrs → try_table", "flow", "b4 [].1: 2 instrs → falls through {may trap}"],
  ["b2 [0/0.0/0].0: 6 instrs → if {may trap, call, handler unresolved}", "flow", "b3 [0/0.0/0.0/0].0: 0 instrs → throw 0 {handler unresolved}"],
  ["b2 [0/0.0/0].0: 6 instrs → if {may trap, call, handler unresolved}", "flow", "b4 [].1: 2 instrs → falls through {may trap}"],
  ["b3 [0/0.0/0.0/0].0: 0 instrs → throw 0 {handler unresolved}", "flow", "raise"],
  ["b4 [].1: 2 instrs → falls through {may trap}", "flow", "exit"],
  ["b2 [0/0.0/0].0: 6 instrs → if {may trap, call, handler unresolved}", "effect", "trap"],
  ["b2 [0/0.0/0].0: 6 instrs → if {may trap, call, handler unresolved}", "effect", "raise"],
  ["b4 [].1: 2 instrs → falls through {may trap}", "effect", "trap"],
]
initial = ["b0 [].0: 0 instrs → block"]
accepting = ["exit"]
rejecting = []
error = ["trap", "raise", "invalid"]

