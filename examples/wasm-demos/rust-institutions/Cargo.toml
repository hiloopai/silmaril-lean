[workspace]
resolver = "3"
members = ["institution", "adder-core", "adder", "door-lock", "door", "door-buggy", "leaf-door-opens", "leaf-overflow", "wasm2lean"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
debug = false
strip = true

[profile.dev]
panic = "abort"
