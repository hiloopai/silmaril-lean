  "Silmaril.Proofs.Wasm.Verify.+", "Silmaril.Proofs.WasmSpec.+", "Silmaril.Proofs.X86.+",
  "Silmaril.Raw.Elf.+", "Silmaril.Raw.Formats.+", "Silmaril.Raw.Process.+", "Silmaril.Raw.Semantics.+",
  "Silmaril.Raw.Wasm.Auto.+", "Silmaril.Raw.Wasm.Auto2.+", "Silmaril.Raw.X86.+",
  "Silmaril.RiscV.+", "Silmaril.SSA.+",
  "Silmaril.Semantics.+", "Silmaril.Wasm.Auto.+", "Silmaril.Wasm.Auto2.+",
