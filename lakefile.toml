# The Cerberus oracle replays (docs/projects/cerberus.md): each reads the genuine Cerberus
# fixtures under benchmarks/cerberus-elaboration/oracle at run time.
[[lean_exe]]
name = "ci_cerberus_genuine_oracle"
root = "tests.cerberus.GenuineOracle"
leanOptions = { autoImplicit = true }

[[lean_exe]]
name = "ci_cerberus_elaboration_oracle"
root = "tests.cerberus.ElaborationOracle"
leanOptions = { autoImplicit = true }

[[lean_exe]]
name = "ci_cerberus_parameter_call"
root = "tests.cerberus.ParameterCallRuntime"

[[lean_exe]]
name = "ci_cerberus_integer_cast"
root = "tests.cerberus.IntegerCastRuntime"

# The worked example of the System V translation-validation shapes (docs/projects/sysv-tv.md):
# it reads the records and the registry under `silmaril/` and the objects it registers.
[[lean_lib]]
name = "SysVTvExample"
srcDir = "examples/sysv-tv"
roots = ["SysVTvExample", "SysVTvRtl"]
needs = ["projectRecords", "sysvTvData"]

[[input_dir]]
name = "sysvTvData"
path = "examples/sysv-tv/max2"

# The examples of segment-by-segment C translation validation (docs/projects/compiles-to.md),
# generated by tools/c-tv: they read the records and the registry under `silmaril/` and the
# C sources and objects they register.
[[lean_lib]]
name = "CompilesToExamples"
srcDir = "examples/compiles-to"
globs = ["CompilesToExamples.*"]
needs = ["projectRecords", "compilesToData"]

[[input_dir]]
name = "compilesToData"
path = "examples/compiles-to"
filter = { extension = ["c", "o"] }

# The C compiler's executables (docs/projects/ccomp.md): the native compiler, the
