name = "silmaril"
version = "0.1.0"
defaultTargets = ["Silmaril"]
restoreAllArtifacts = true
[leanOptions]
autoImplicit = false
# Temporary Lean downstream snapshot; replace these overrides with normal
# upstream pins when CSLib supports the 4.37 release (owner: Thomas).
[[require]]
name = "mathlib"
git = "https://github.com/leanprover/downstream-lean4"
rev = "569134c2fc750d92baa85d50cd925a7e20a93dd2"
subDir = "mathlib4"

[[require]]
name = "cslib"
git = "https://github.com/leanprover/downstream-lean4"
rev = "569134c2fc750d92baa85d50cd925a7e20a93dd2"
subDir = "cslib"

[[require]]
name = "batteries"
git = "https://github.com/leanprover-community/batteries"
rev = "6d1440736b73168c55f541c98aa29b62ad155a57"

[[require]]
name = "Qq"
git = "https://github.com/leanprover-community/quote4"
rev = "7aa6104d4838734d0894f1e7c002b6950e4c51e7"

[[require]]
name = "aesop"
git = "https://github.com/leanprover-community/aesop"
rev = "fb8aa936d5607ac054fb732ba01ea37e1bc0404f"

[[require]]
name = "proofwidgets"
git = "https://github.com/leanprover-community/ProofWidgets4"
rev = "ab5717cea9074a46c5b678c80bd225c60ceae7d4"

[[require]]
name = "plausible"
git = "https://github.com/leanprover-community/plausible"
rev = "1cfc4bdd5be138c8c5ca20e61c0515a392b915c2"

[[require]]
name = "LeanSearchClient"
git = "https://github.com/leanprover-community/LeanSearchClient"
rev = "50cd21bc62f2c8357c4f269d1185921cbfcdfc90"

[[require]]
name = "importGraph"
git = "https://github.com/leanprover/downstream-lean4"
rev = "569134c2fc750d92baa85d50cd925a7e20a93dd2"
subDir = "import-graph"

[[require]]
name = "Cli"
git = "https://github.com/leanprover/lean4-cli"
rev = "13567aed1ac4f12aea9484178e07e51f8c9f7658"


[[lean_lib]]
name = "Silmaril"
globs = ["Silmaril.*"]
# The SpecTec streams and sources read while elaborating (`spectec_import`,
# `spectec_check_stream`, the surface-language checks): see specs/spectec/README.md.
needs = [
  "spectecWasm10", "spectecWasm20", "spectecWasm30",
  "spectecMainWasm10", "spectecMainWasm20", "spectecMainWasm30",
  "spectecSurfaceVars", "spectecSurfaceNum", "spectecSurfaceBinary",
]

[[input_file]]
name = "spectecWasm10"
path = "specs/spectec/wasm-1.0.ast"
text = false

[[input_file]]
name = "spectecWasm20"
path = "specs/spectec/wasm-2.0.ast"
text = false

[[input_file]]
name = "spectecWasm30"
path = "specs/spectec/wasm-3.0.ast"
text = false

[[input_file]]
name = "spectecMainWasm10"
path = "specs/spectec/e7a9df7c/wasm-1.0.ast"
text = false

[[input_file]]
name = "spectecMainWasm20"
path = "specs/spectec/e7a9df7c/wasm-2.0.ast"
text = false

[[input_file]]
name = "spectecMainWasm30"
path = "specs/spectec/e7a9df7c/wasm-3.0.ast"
text = false

[[input_file]]
name = "spectecSurfaceVars"
path = "specs/spectec/src/specification/wasm-3.0/0.1-aux.vars.spectec"
text = false

[[input_file]]
name = "spectecSurfaceNum"
path = "specs/spectec/src/specification/wasm-3.0/0.2-aux.num.spectec"
text = false

[[input_file]]
name = "spectecSurfaceBinary"
path = "specs/spectec/src/specification/wasm-3.0/5.1-binary.values.spectec"
text = false

# The `sil project` self-test (examples/project/selftest.sh). Its module reads files while it
# elaborates: the records files and the registry under `silmaril/` (`silmaril load`, `silmaril
# artifacts`) and the files the registry names (`silmaril value`). Lake sees such reads only
# through the `needs` of the module's library, and it mixes a library's `needs` into the trace
# of every module of that library, so the readers have a library of their own: an input here
# rebuilds only them, never `Silmaril`. (The format examples are also read by
# `Silmaril.Project.Formats.*.Thms`; they are fixed test vectors with receipts.)
[[lean_lib]]
name = "ProjectSelfTest"
srcDir = "examples/project"
needs = ["projectRecords", "projectSelfTestData", "projectFormatExamples"]

[[input_dir]]
name = "projectRecords"
path = "silmaril"
filter = { extension = ["toml"] }
text = true

[[input_dir]]
name = "projectSelfTestData"
path = "examples/project/data"

[[input_dir]]
name = "projectFormatExamples"
path = "examples/project-formats"
[[lean_exe]]
name = "wasm-as"
root = "WasmAsCompat"
srcDir = "tools/binaryen-lean"
supportInterpreter = true
[[lean_exe]]
name = "wasm-dis"
root = "WasmDisCompat"
srcDir = "tools/binaryen-lean"
supportInterpreter = true
[[lean_exe]]
name = "wasm-opt"
root = "WasmOptCompatLean"
srcDir = "tools/binaryen-lean"
supportInterpreter = true
[[lean_exe]]
name = "wasm-merge"
root = "WasmMergeCompat"
srcDir = "tools/binaryen-lean"
supportInterpreter = true
[[lean_exe]]
name = "wasm-shell"
root = "WasmShellCompat"
srcDir = "tools/binaryen-lean"
supportInterpreter = true
[[lean_exe]]
name = "wasm-ctor-eval"
root = "WasmCtorEvalCompat"
srcDir = "tools/binaryen-lean"
supportInterpreter = true
[[lean_exe]]
name = "wasm-metadce"
root = "WasmMetaDCECompat"
srcDir = "tools/binaryen-lean"
supportInterpreter = true
[[lean_exe]]
name = "wasm-shell-lean"
root = "WasmShellLean"
srcDir = "tools/binaryen-lean"
supportInterpreter = true

# The subcommand groups of the wasm-tools executable (imported by its root as `WasmTools.*`).
[[lean_lib]]
name = "WasmToolsCli"
srcDir = "tools/wasm-tools"
globs = ["WasmTools.+"]

[[lean_exe]]
name = "wasm-tools"
root = "WasmTools"
srcDir = "tools/wasm-tools"

[[lean_exe]]
name = "wasm-asyncify"
root = "WasmAsyncify"
srcDir = "tools/wasm-asyncify"

[[lean_exe]]
name = "wasm-check"
root = "WasmCheck"
srcDir = "tools/wasm-check"
supportInterpreter = true

[[lean_lib]]
name = "WasmAutoTests"
globs = ["tests.wasm.auto.+"]
