# The SpecTec trees. Their reading modules (`spectec_import`, `spectec_check_stream`,
# `spectec_check_slice`, `spectec_crosscheck`, `spectec_revalidate`, `spectec_source` and the
# `checkStreamFile`/`readScript` evals) read the pinned streams and sources while elaborating:
# see specs/spectec/README.md. Lake mixes a library's `needs` into the trace of every module of
# that library, so they live here and not on `Silmaril`, whose traces (and published cache) stay
# as on main. Declared after `Silmaril` so that imports resolve to this library.
[[lean_lib]]
name = "SilmarilSpecTec"
globs = [
  "Silmaril.Wasm.SpecTec.AstText.+",
  "Silmaril.Wasm.SpecTec.BinaryAgree.+",
  "Silmaril.Wasm.SpecTec.Broken.+",
  "Silmaril.Wasm.SpecTec.Defs",
  "Silmaril.Wasm.SpecTec.GrammarInst.+",
  "Silmaril.Wasm.SpecTec.Institution.+",
  "Silmaril.Wasm.SpecTec.Lime1Gram.+",
  "Silmaril.Wasm.SpecTec.Scripts.+",
  "Silmaril.Wasm.SpecTec.Sim.+",
  "Silmaril.Wasm.SpecTec.Sim10.+",
  "Silmaril.Wasm.SpecTec.Sim20.+",
  "Silmaril.Wasm.SpecTec.SimLime1.+",
  "Silmaril.Wasm.SpecTec.SimLime1Div.+",
  "Silmaril.Wasm.SpecTec.SimLime1Div20.+",
  "Silmaril.Wasm.SpecTec.Surface.+",
  "Silmaril.Wasm.SpecTec.Thms",
  "Silmaril.Wasm.SpecTec.VersionEval.+",
  "Silmaril.Wasm.SpecTec.Versions.+",
  "Silmaril.Proofs.Wasm.SpecTec.AstText.+",
  "Silmaril.Proofs.Wasm.SpecTec.Broken.+",
  "Silmaril.Proofs.Wasm.SpecTec.GrammarInst.+",
  "Silmaril.Proofs.Wasm.SpecTec.Institution.+",
  "Silmaril.Proofs.Wasm.SpecTec.Lime1Gram.+",
  "Silmaril.Proofs.Wasm.SpecTec.Scripts.+",
  "Silmaril.Proofs.Wasm.SpecTec.Sim.+",
  "Silmaril.Proofs.Wasm.SpecTec.Sim10.+",
  "Silmaril.Proofs.Wasm.SpecTec.Sim20.+",
  "Silmaril.Proofs.Wasm.SpecTec.SimLime1.+",
  "Silmaril.Proofs.Wasm.SpecTec.SimLime1Div.+",
  "Silmaril.Proofs.Wasm.SpecTec.SimLime1Div20.+",
  "Silmaril.Proofs.Wasm.SpecTec.Surface.+",
  "Silmaril.Proofs.Wasm.SpecTec.Versions.+",
  "Silmaril.Raw.Wasm.SpecTec.Basic",
  "Silmaril.Raw.Wasm.SpecTec.Encode",
  "Silmaril.Raw.Wasm.SpecTec.EncodeOps",
  "Silmaril.Raw.Wasm.SpecTec.Examples",
  "Silmaril.Raw.Wasm.SpecTec.FloatBits",
  "Silmaril.Raw.Wasm.SpecTec.Generated",
  "Silmaril.Raw.Wasm.SpecTec.Scripts",
  "Silmaril.Raw.Wasm.SpecTec.Scripts.+",
  "Silmaril.Raw.Wasm.SpecTec.Sim.+",
  "Silmaril.Raw.Wasm.SpecTec.Sim10.+",
  "Silmaril.Raw.Wasm.SpecTec.Sim20.+",
  "Silmaril.Raw.Wasm.SpecTec.SpecTec",
  "Silmaril.Raw.Wasm.SpecTec.SpecTec.+",
  "Silmaril.Raw.Wasm.SpecTec.Wasm.+",
]
needs = [
  "spectecWasm10", "spectecWasm20", "spectecWasm30",
  "spectecMainWasm10", "spectecMainWasm20", "spectecMainWasm30",
  "spectecSurfaceVars", "spectecSurfaceNum", "spectecSurfaceBinary",
]


