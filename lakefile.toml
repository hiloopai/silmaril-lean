# The WASI WIT readers (`Silmaril.Wasi.Versions.WitImport.*`): their `wit_*` commands and terms
# read the vendored WIT files of specs/wasi while they elaborate. Lake mixes a library's `needs`
# into the trace of every module of that library, so they have a library of their own and the
# `Silmaril` library's traces stay as they are.
# The Wasm components registry and the WASI 0.3 Rust example components
# (docs/projects/wasm-extras.md): these modules read the records under `silmaril/` (`silmaril load`),
# the registered binaries and the example components (`include_chunks`) while they elaborate, so
# they are a library of their own and the `Silmaril` library's traces stay as they are.
[[lean_lib]]
name = "SilmarilWasmProject"
globs = ["Silmaril.Project.WasmComponents.+", "Silmaril.Project.WasmP3Rust.+"]
needs = ["projectRecords", "projectFormatExamples", "wasmComponentsBlobs", "wasip3RustBlobs", "wasiIoFixture"]

[[input_dir]]
name = "wasmComponentsBlobs"
path = "examples/wasm-components"
text = false

[[input_dir]]
name = "wasip3RustBlobs"
path = "examples/wasip3-rust/dist"
text = false

[[input_file]]
name = "wasiIoFixture"
path = "tests/wat/fixtures/wasi-io-0.2.12.wasm"
text = false

[[lean_lib]]
name = "SilmarilWasiWit"
globs = ["Silmaril.Wasi.Versions.WitImport.+"]
needs = ["wasiWit"]

[[input_dir]]
name = "wasiWit"
path = "specs/wasi"
filter = { extension = ["wit"] }
text = true

# The `sil project` self-test (examples/project/selftest.sh). Its module reads files while it
# elaborates: the records files and the registry under `silmaril/` (`silmaril load`, `silmaril
# artifacts`) and the files the registry names (`silmaril value`). Lake sees such reads only
# through the `needs` of the module's library, and it mixes a library's `needs` into the trace
# of every module of that library, so the readers have a library of their own: an input here
# rebuilds only them, never `Silmaril`. (The format examples are also read by
# `Silmaril.Project.Formats.*.Thms`; they are fixed test vectors with receipts.)
[[lean_lib]]
name = "ProjectSelfTest"
srcDir = "examples/project"
globs = ["ProjectSelfTest", "ProjectSelfTest.+"]
needs = ["projectRecords", "projectSelfTestData", "projectFormatExamples"]

[[input_dir]]
name = "projectRecords"
path = "silmaril"
filter = { extension = ["toml"] }
text = true

[[input_dir]]
name = "projectSelfTestData"
path = "examples/project/data"

[[input_dir]]
name = "projectFormatExamples"
path = "examples/project-formats"
[[lean_exe]]
name = "wasm-as"
root = "WasmAsCompat"
srcDir = "tools/binaryen-lean"
supportInterpreter = true
[[lean_exe]]
