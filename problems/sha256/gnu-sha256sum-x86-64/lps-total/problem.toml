spec = { decl = "Silmaril.Apps.Sha256sum.sha256sum", note = "GNU coreutils 9.4 sha256sum; stdin tier: (sha256sum w).stdout = hex(SHA-256(stdin)) ++ \"  -\\n\", status 0" }

