schema = "silmaril.problem.v1"
id = "sha256/gnu-sha256sum-x86-64/lps-total"
family = "sha256"
title = "Total correctness of GNU sha256sum (sha256sum-min) in LPS on the stdin tier"
granularity = "process"
tier = "total"
expect = "solvable"
# Solved: GnuSha256sum.Close.lpsTotal_close (VERIFIED). Linked: Registry.lpsTotal_link : All [sys-total, lps-bridge] -> lps-total (VERIFIED);
# lps-bridge is solved, and Release.lpsTotal_of derives lps-total from the open segments
# (Release.Open: startup, final, format, exit; the read loop is ReadLoop.readLoopSeg), VERIFIED.
# argv = [prog], finite stdin, every flag oracle / refusal configuration / budget: no error,
# nothing unmodelled, every trace a prefix of idealTrace (read stdin, write (sha256sum w).stdout,
# exit 0), every execution exits 0, and the ideal trace occurs.
# closure_hash re-pinned after main's LPS v0.1 fixes: x86LaunchBounds.spWindowLo is now
# 0x7ffb7fffe000 (2 GiB below the lowest randomized x86-64 stack top; was 0x7fff7ffff000), so
# ValidEntry admits every Linux v6.13-v6.18 initial rsp; the native syscall table also changed
# (socket, epoll, signal, mm fixes). The statement hash is unchanged.

[statement]
decl = "Silmaril.Process.LPS.Problems.GnuSha256sum.Registry.lpsTotal"
