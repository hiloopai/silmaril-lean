schema = "silmaril.records.v0.2"

# a wrong problem: kept, deprecated, with its replacement
[[deprecation]]
name = "mk.old_bound"
reason = "off by one: the bound is 255, not 256"
superseded_by = ["mk.new_bound"]

# a wrong spec: every problem whose judgement names it is deprecated
[[deprecation]]
name = "mk.specs.old"
reason = "ignores the length prefix"
superseded_by = ["mk.specs.new"]

# a wrong general problem: its instances are deprecated
[[deprecation]]
name = "mk.gen"
reason = "quantifies over the wrong domain"
superseded_by = ["mk.fn.new"]

