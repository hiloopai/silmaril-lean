[package]
name = "silmaril-project"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT"
description = "Silmaril projects: check a Lean project dump, write its canonical SQL, SQLite and explorer page."

[[bin]]
name = "silmaril-project"
path = "src/main.rs"

[dependencies]
blake3 = "1.8.7"
clap = { version = "4.6", features = ["derive"] }
miette = { version = "7.6", features = ["fancy"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha1 = "0.11"
sha2 = "0.11"
toml = "1.1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
