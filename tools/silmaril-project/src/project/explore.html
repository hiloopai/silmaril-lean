    mode, size: bytes.length,
    async query(sql, params) {

// ---------- summary ----------
// The holds/fails/unknown coarsening of a status (as `sil project check`): UNS fails only for a
// closed (arity 0) problem; `contingent` fails; otherwise the `szs` table's verdict.
const COARSE = "CASE WHEN st.status = 'UNS' AND p.arity = 0 THEN 'fails' WHEN st.status = 'contingent' THEN 'fails' " +
  "ELSE coalesce(z.verdict, 'unknown') END";

// the pages it needs.
async function summary() {

  const local = proj.find((p) => p.origin === "local");

  const counts = [
    ...await tq("objects", "SELECT kind, count(*) AS n FROM objects GROUP BY kind"),
    ...await tq("artifacts", "SELECT 'artifact' AS kind, count(*) AS n FROM artifacts"),
    ...await tq("edges", "SELECT 'edge:' || kind AS kind, count(*) AS n FROM edges GROUP BY kind"),
    ...await tq("answers", "SELECT 'answer' AS kind, count(*) AS n FROM answers")];
  h += '<div class="grid"><div><h2>Objects by kind</h2>' + await table(counts) + "</div>";
  const vs = await tq("summary", "SELECT verdict, summary, count(*) AS n FROM summary GROUP BY 1, 2 ORDER BY 1, 2");
  const by = { holds: 0, fails: 0, unknown: 0 };
  for (const r of vs) by[r.verdict] = (by[r.verdict] || 0) + r.n;
  const tot = vs.reduce((a, r) => a + r.n, 0) || 1;
  h += "<div><h2>Derived verdicts (problems)</h2><div class=\"bar\">" +
    ["holds", "fails", "unknown"].map((v) => by[v] ? `<div class="${v}" style="width:${100 * by[v] / tot}%" title="${v} ${by[v]}"></div>` : "").join("") +
    "</div>" + await table(vs, ["summary", "verdict", "n"]) + "</div>";
  if (tables.has("statuses")) {
    h += "<div><h2>Statuses by SZS code</h2>" + await table(await q(
      `SELECT st.status AS code, z.name, ${COARSE} AS verdict, count(*) AS statuses, count(DISTINCT st.problem) AS problems ` +
      "FROM statuses st LEFT JOIN szs z ON z.code = st.status LEFT JOIN problems p ON p.name = st.problem GROUP BY 1, 3 ORDER BY 3, 1 LIMIT 200")) +
      '<p class="muted">holds = THM; fails = CSA, contingent, UNS of a closed problem; unknown = the rest.</p></div>';
  }
  h += "</div>";
  if (local && local.root) {
    await resolve([local], ["root"], HINTS, false);

  }
  if (tables.has("objects") && tables.has("edges")) {
    const ng = (await q("SELECT count(*) AS n FROM objects WHERE kind = 'group'"))[0].n;
    if (ng) {
      // Names only: counting or tallying every group's children would read most of `edges`.
      const gs = await q("SELECT name AS group_name FROM objects WHERE kind = 'group' ORDER BY name LIMIT 100");
      h += `<h2>Groups (${ng})</h2>` + await table(gs, null, { hints: { group_name: "problem" } }) +
        (ng > 100 ? '<p class="muted">the first 100 groups</p>' : "") +
        '<p class="muted">a group\'s verdict vector is on its page (children, in order) and in the graph</p>';
    }
  }
  if (tables.has("summary")) {
    // With the index on summary(verdict, summary), CROSS JOIN keeps `summary` as the outer
    // loop and the scan ends after 100 rows. Without it, sorting or the detached filter would read
    // all of `summary` and `problems`, so take the first 100 in key order.
    const tuned = indexes.has("summary_verdict") || indexes.has("httpvfs_summary_verdict");
    const open = tuned
      ? await first(100, "SELECT s.problem AS name, s.summary, s.verdict FROM summary s CROSS JOIN problems p " +
        "WHERE p.name = s.problem AND s.verdict IN ('fails', 'unknown') AND p.detached = 0 ORDER BY s.verdict, s.summary")
      : await first(100, "SELECT problem AS name, summary, verdict FROM summary WHERE verdict IN ('fails', 'unknown')");

      `<p class="muted">${tuned ? "not detached, fails first" : "in name order, detached included (the database predates the canonical indexes)"}</p>` +
      await tableOf(open, null, { hints: { name: "problem" } });
  }
  h += "<h2>Meta</h2>" + await table(await tq("meta", "SELECT * FROM meta LIMIT 100"));
  if (proj.length > 1) h += "<h2>Projects</h2>" + await table(proj, ["name", "origin", "version", "root", "url", "rev"]);
  return h;
}

// A page of `PAGE` rows at a time; the filter is a case-insensitive substring of `filter` columns
// and stops reading once a page of matches is found.
const PAGE = 100;
async function listPage(spec) {
  const total = tables.has(spec.table) ? (await q(`SELECT count(*) AS n FROM ${spec.table}`))[0].n : 0;
  const html = `<h2>${esc(spec.title)} (${total})</h2><div class="controls">
    <input type="text" id="filter" placeholder="filter: ${esc(spec.filter.join(", "))} contains…" size="44">
    <button id="prev">◀ previous</button><button id="next">next ▶</button><span id="range" class="muted"></span></div><div id="list"></div>`;
  const init = async () => {
    let off = 0, tok = 0;
    const draw = async () => {
      const mine = ++tok, f = $("#filter").value.trim().toLowerCase();
      const where = f ? "WHERE " + spec.filter.map((c) => `instr(lower(${c}), ?) > 0`).join(" OR ") : "";
      const rows = await q(`SELECT ${spec.select} ${where} ORDER BY ${spec.order} LIMIT ${PAGE + 1} OFFSET ${off}`, f ? spec.filter.map(() => f) : []);
      const html = await table(rows.slice(0, PAGE), spec.cols, { hints: spec.hints });
      if (mine !== tok || !$("#list")) return;
      $("#list").innerHTML = html;
      $("#range").textContent = rows.length ? `rows ${off + 1}–${off + Math.min(rows.length, PAGE)}${f ? " of the matches" : ` of ${total}`}` : "";
      $("#prev").disabled = off === 0; $("#next").disabled = rows.length <= PAGE;
      updateStats();
    };
    let timer = null;
    $("#filter").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => { off = 0; draw(); }, 250); });
    $("#prev").addEventListener("click", () => { off = Math.max(0, off - PAGE); draw(); });
    $("#next").addEventListener("click", () => { off += PAGE; draw(); });
    await draw();
  };
  return { html, init };
}

// ---------- generic rooted-graph analysis (shared by machines and control-flow graphs) ----------
// A provenance badge for a displayed analysis: checked by the Lean kernel (with the theorem that
// checks it), computed by a generator without a proof, or computed here in the browser.
function provBadge(kind, detail) {
  const t = { lean: "Lean kernel-checked", gen: "generator-computed, unchecked", browser: "browser-computed, unchecked" }[kind];
  return `<span class="prov prov-${kind}" title="${esc(detail || "")}">${t}${detail ? ": " + esc(detail) : ""}</span>`;
}
// Immediate dominators of `nodes` (ids) under `edges` ([from, to]) from the entries `roots`:
// with several roots, a synthetic root (id null) precedes them, as in Silmaril.Automata.Graph's
// `withRoot`. Returns { idom: Map(node -> parent or null), reachable: Set }. Iterative dataflow
// over dominator sets: small graphs only; an unreachable node has no entry in `idom`.
function dominators(nodes, edges, roots) {
  const ROOT = "\u0000root";
  const preds = new Map(nodes.map((n) => [n, []]));
  for (const [a, b] of edges) if (preds.has(b) && preds.has(a)) preds.get(b).push(a);
  const entry = roots.length === 1 ? roots[0] : ROOT;
  if (roots.length !== 1) { preds.set(ROOT, []); for (const r of roots) preds.get(r).push(ROOT); }
  const all = [...preds.keys()];
  // reachability from the entry
  const succ = new Map(all.map((n) => [n, []]));
  for (const [b, ps] of preds) for (const a of ps) succ.get(a).push(b);
  const reach = new Set([entry]), todo = [entry];
  while (todo.length) for (const b of succ.get(todo.pop())) if (!reach.has(b)) { reach.add(b); todo.push(b); }
  const R = all.filter((n) => reach.has(n));
  const dom = new Map(R.map((n) => [n, n === entry ? new Set([n]) : new Set(R)]));
  for (let changed = true; changed;) {
    changed = false;
    for (const n of R) {
      if (n === entry) continue;
      let acc = null;
      for (const p of preds.get(n)) if (reach.has(p)) acc = acc ? new Set([...acc].filter((x) => dom.get(p).has(x))) : new Set(dom.get(p));
      const next = new Set(acc || []); next.add(n);
      if (next.size !== dom.get(n).size) { dom.set(n, next); changed = true; }
    }
  }
  const idom = new Map();
  for (const n of R) {
    if (n === entry) { idom.set(n, null); continue; }
    const strict = [...dom.get(n)].filter((x) => x !== n);
    // the strict dominator dominated by all others has the largest dominator set
    const p = strict.reduce((best, x) => (best === undefined || dom.get(x).size > dom.get(best).size ? x : best), undefined);
    idom.set(n, p === ROOT ? null : p);
  }
  idom.delete(ROOT);
  return { idom, reachable: new Set(R.filter((n) => n !== ROOT)), synthetic: entry === ROOT };
}
// Draw a dominator tree (node -> parent) into `container`; unreachable nodes are listed apart.
function drawDomTree(container, nodes, idom, label, style) {
  const els = nodes.filter((n) => idom.has(n)).map((n) => ({ data: { id: "d:" + n, label: label(n) } }));
  let i = 0;
  for (const [n, p] of idom) if (p !== null && p !== undefined) els.push({ data: { id: "t" + (i++), source: "d:" + p, target: "d:" + n } });
  return cytoscape({ container, elements: els, wheelSensitivity: 0.2,
    layout: { name: "dagre", rankDir: "TB", nodeSep: 30, rankSep: 50 },
    style: [{ selector: "node", style: Object.assign({ label: "data(label)", "background-color": "#fff", "border-color": "#2f5d9e",
      "border-width": 1.5, shape: "round-rectangle", width: "label", height: 24, padding: 8, "font-size": 11,
      "text-valign": "center", "text-halign": "center" }, style || {}) },
      { selector: "edge", style: { "curve-style": "bezier", "target-arrow-shape": "triangle", width: 1.2,
        "line-color": "#9aa0a6", "target-arrow-color": "#9aa0a6" } }] });
}

// A machine document drawn from its canonical JSON (states, labels, edges, layers): states are
// nodes (initial: thick border; accepting: double border; rejecting: orange; error: red).
// Parallel edges between two states are merged into one edge, and self-loops are folded into
// their state (a "↺ n" badge), so large machines stay readable. Labels written as pairs
// "(a,b)" are grouped by their second component ("send|recv priority"). Clicking a state or an
// edge lists its transitions in full below the graph.
function compactLabels(ls) {
  const groups = new Map(), rest = [];
  for (const l of ls) {
    const m = /^\(([^,()]*),(.*)\)$/.exec(l);
    if (m) { if (!groups.has(m[2])) groups.set(m[2], []); groups.get(m[2]).push(m[1]); } else rest.push(l);
  }
  return [...[...groups].map(([b, as]) => `${as.join("|")} ${b}`), ...rest];
}

// Nodes: the focus's parents (up to 50), then whole levels below the focus, down to `depth` levels
// and while the total stays within `maxNodes` (dagre is slow on thousands of nodes). Each level is
// one bounded query for the edges out of the previous level.
async function drawGraph(focus, depth, maxNodes, withDetached, root) {
  const exists = async (n) => n && (await q("SELECT 1 AS x FROM problems WHERE name = ?", [n])).length > 0;
  let note = "";
  if (!(await exists(focus))) { if (focus) note = ` · no problem ${focus}`; focus = root; }
  const keep = new Set(), out = new Map();
  // The edges out of `names`, at most `cap` rows in all. Rows come in parent order, so when the
  // cap cuts a read every parent before the cut is complete; `out` records only complete ones.
  // Returns whether every parent was read.
  const cap = 4 * maxNodes;
  const fetchOut = async (names) => {
    const todo = names.filter((n) => !out.has(n)).sort();
    let budget = cap;
    for (let i = 0; i < todo.length; i += 300) {
      const part = todo.slice(i, i + 300);
      const rows = await q(`SELECT parent, child, kind, via FROM edges WHERE parent IN (${ph(part.length)}) ORDER BY parent LIMIT ${budget + 1}`, part);
      const cut = rows.length > budget ? rows[budget].parent : null;
      for (const n of part) if (cut === null || n < cut) out.set(n, []);
      for (const e of rows) if (out.has(e.parent) && e.parent !== cut) out.get(e.parent).push(e);
      if (cut !== null) return false;
      budget -= rows.length;
    }
    return true;
  };
  if (await exists(focus)) {
    const parents = await q("SELECT DISTINCT parent FROM edges WHERE child = ? LIMIT 50", [focus]);
    for (const r of parents) keep.add(r.parent);
    keep.add(focus);
    let frontier = [focus];
    for (let d = 0; d < depth && frontier.length; d++) {
      const complete = await fetchOut(frontier);
      const next = new Set();
      for (const n of frontier) for (const e of out.get(n) || []) if (!keep.has(e.child)) next.add(e.child);
      if (!complete) { note += ` · stopped at depth ${d} (the next level has more than ${cap} edges; raise max nodes or refocus)`; break; }
      if (next.size && keep.size + next.size > maxNodes) { note += ` · stopped at depth ${d} (next level has ${next.size} nodes; raise max nodes or refocus)`; break; }
      for (const n of next) keep.add(n);
      frontier = [...next];
    }
    await fetchOut([...keep]);
  }
  if (withDetached && keep.size < maxNodes) {
    for (const r of await q("SELECT name FROM problems WHERE detached = 1 ORDER BY name LIMIT ?", [maxNodes - keep.size])) keep.add(r.name);
    await fetchOut([...keep]);
  }
  // Node data from indexes where possible: group-ness from objects(kind, name), detached-ness,
  // verdicts by problem; titles only for groups.
  const names = [...keep];
  const groupSet = new Set((await inChunks("SELECT name FROM objects WHERE kind = 'group' AND name IN ($)", names)).map((r) => r.name));
  const detached = new Set((await inChunks("SELECT name FROM problems WHERE detached = 1 AND name IN ($)", names)).map((r) => r.name));
  const titles = new Map((await inChunks("SELECT name, title FROM problems WHERE name IN ($)", [...groupSet])).map((r) => [r.name, r.title]));
  const checked = new Set();
  const lookUp = async (ns) => {
    for (const n of ns) checked.add(n);
    for (const r of await inChunks("SELECT problem, summary, verdict FROM summary WHERE problem IN ($)", ns)) { verdictOf.set(r.problem, r.verdict); summaryOf.set(r.problem, r.summary); }
  };
  await lookUp(names);
  // A group's label tallies its children's verdicts; at most GROUP_LOOKUPS children that are not
  // drawn are looked up, the rest are counted as unchecked.
  const hiddenChildren = [...new Set([...groupSet].flatMap((g) => (out.get(g) || []).map((e) => e.child)).filter((c) => !checked.has(c)))];
  await lookUp(hiddenChildren.slice(0, GROUP_LOOKUPS));
  const gv = new Map();
  for (const g of groupSet) {
    const c = { holds: 0, fails: 0, unknown: 0, unchecked: 0 };
    for (const e of out.get(g) || []) c[checked.has(e.child) ? verdictOf.get(e.child) || "unknown" : "unchecked"]++;
    gv.set(g, c);
  }
  const els = [];
  for (const n of keep) {
    const isGroup = groupSet.has(n);
    let label = shortName(n);
    if (isGroup) {
      const c = gv.get(n);
      label = (titles.get(n) || shortName(n)) + (out.has(n) ? `\n${c.holds} / ${c.fails} / ${c.unknown}` + (c.unchecked ? ` (${c.unchecked} unchecked)` : "") : "");
    } else if (summaryOf.has(n)) label += "\n" + summaryOf.get(n);
    const hidden = (out.get(n) || []).filter((e) => !keep.has(e.child)).length;
    if (hidden) label += ` (+${hidden} hidden)`;
    else if (!out.has(n)) label += " (+ more, not read)";
    els.push({ data: { id: n, label, verdict: verdictOf.get(n) || "unknown", group: isGroup ? 1 : 0, detached: detached.has(n) ? 1 : 0, root: n === root ? 1 : 0, focus: n === focus ? 1 : 0 } });
  }
  let i = 0;
  for (const n of keep) for (const e of out.get(n) || []) if (keep.has(e.child)) els.push({ data: { id: "e" + (i++), source: e.parent, target: e.child, kind: e.kind, via: e.via || "" } });
  $("#gcount").textContent = `${keep.size} problems, ${i} edges${note}`;
  if (cy) cy.destroy();
  cy = cytoscape({
    container: $("#cy"), elements: els, minZoom: 0.05,
    style: [
      { selector: "node", style: { label: "data(label)", "text-wrap": "wrap", "text-overflow-wrap": "anywhere", "text-max-width": 140, "font-size": 10, "text-valign": "center", "text-halign": "center",
        width: 150, height: 34, shape: "round-rectangle", "background-color": (n) => COLORS[n.data("verdict")], color: "#fff", "text-outline-width": 0,
        "border-width": 1, "border-color": "#33393f" } },
      { selector: "node[group = 1]", style: { shape: "rectangle", "background-color": "#f4f6f8", color: "#1d2329", width: 180, height: 44, "border-width": 2, "border-color": "#2f5d9e", "font-weight": 600 } },
      { selector: "node[detached = 1]", style: { "border-style": "dashed", opacity: 0.75 } },
      { selector: "node[root = 1]", style: { "border-width": 4, "border-color": "#111" } },
      { selector: "node[focus = 1]", style: { "underlay-color": "#f2c94c", "underlay-opacity": 0.6, "underlay-padding": 6 } },
      { selector: "node:selected", style: { "overlay-color": "#2f5d9e", "overlay-opacity": 0.25 } },
      { selector: "edge", style: { width: 1.4, "curve-style": "bezier", "target-arrow-shape": "triangle", "arrow-scale": 0.8, "line-color": "#8a939c", "target-arrow-color": "#8a939c" } },
      { selector: "edge[kind = 'refute']", style: { "line-style": "dashed", "line-color": "#c46a6a", "target-arrow-color": "#c46a6a" } },
      { selector: "edge[kind = 'instance']", style: { "line-style": "dotted", "line-color": "#5b7fb5", "target-arrow-color": "#5b7fb5" } },
      { selector: "edge[via != '']", style: { width: 2.2 } },
    ],
    layout: { name: "dagre", rankDir: "TB", nodeSep: 20, rankSep: 50, animate: false },
  });
  const side = async (h) => { const html = await h; $("#side").innerHTML = html; updateStats(); };
  cy.on("tap", "node", (e) => side(problemDetail(e.target.id())));
  cy.on("dbltap", "node", (e) => { location.hash = href("graph", e.target.id()); });
  cy.on("tap", "edge", (e) => { const d = e.target.data();
    side(dl({ parent: d.source, child: d.target, kind: d.kind, via: d.via || null }).then((x) => "<h2>Edge</h2>" + x)); });
  // A wide level makes "fit" unreadable: then zoom in on the focus instead.
  if (cy.zoom() < 0.5 && cy.getElementById(focus).length) { cy.zoom(0.8); cy.center(cy.getElementById(focus)); }
  if (focus && cy.getElementById(focus).length) await side(problemDetail(focus));
}

boot().catch((e) => { $("#main").innerHTML = `<p class="err">${esc(e.stack || e)}</p>`; });
</script>
</body>
</html>
