name: Lake cache helper

on:
  workflow_call:

permissions:
  contents: read

jobs:
  cache:
    name: Real Lake cache round trip
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Test real builds, deduplication and restoration
        run: python3 -m unittest discover -s tools/lake-cache -v
