name: Rust checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  silmaril-project:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/silmaril-project
    env:
      CARGO_TERM_COLOR: always
      RUST_TOOLCHAIN: 1.98.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
      - name: Restore the Cargo cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            tools/silmaril-project/target
          key: cargo-v1-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('tools/silmaril-project/Cargo.lock') }}
          restore-keys: cargo-v1-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests (unit tests and the golden cases)
        run: cargo test --locked
