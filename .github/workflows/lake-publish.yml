name: Lake pool

# Publishes main's Lake build to the shared Lean pool (hiloop live/aws-foundation/lean-cas.tf, lake/)
# with its seed, for pull requests, prove sessions and hosts that never installed silmaril-lean.
# hiloop's prove worker builds the commit next to the pool and publishes it
# (`hiloop-prove publish-build`, hiloop devops/deploy/hosted/prove.md), so this runner downloads no
# build. It runs after CI succeeds on main (a push, or a manual run such as the seed dispatch after a
# toolchain change), outside CI's four-minute budget, and by hand on main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One publication at a time; a newer main waits for the running one.
concurrency:
  group: lake-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish main's Lake build
    if: >-
      github.repository == 'hiloopai/silmaril-lean' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-24.04
    # A publication after a toolchain change builds cold on the worker.
    timeout-minutes: 90
    permissions:
      contents: read
      # GitHub OIDC for the prove api and for the Lean CAS role, which reads the client and puts
      # main's source tree in the pool.
      id-token: write
    env:
      AWS_REGION: us-east-1
      CLIENT: s3://hiloop-lean-cas-607856468300-us-east-1/clients/7a977e3af86c/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # The client diffs against the nearest commit main's CI published.
          fetch-depth: 65
      - name: Assume the Lean CAS role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::607856468300:role/gha-lean-cas
          aws-region: us-east-1
          role-duration-seconds: 7200
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - name: Install hiloop-prove
        run: |
          aws s3 cp --only-show-errors --recursive "$CLIENT" "$RUNNER_TEMP/client/"
          cd "$RUNNER_TEMP/client"
          sha256sum -c - <<'SUMS'
          4979817ee6745fa6eaba8d6b1718e802445170f1f4cdb2f1ee585665a43bbcde  hiloop_prove-0.0.0-py3-none-any.whl
          0ede2941632076f25f7c4e8f717bbdaa9d5be2cacac7648dc4cea0ee05e2ad30  hiloop_common-0.0.0-py3-none-any.whl
          446b51555965b40af2db8a3c4285b14315da0ae9d17e96b7364053112133220d  requirements.txt
          SUMS
          uv venv -q "$RUNNER_TEMP/prove"
          VIRTUAL_ENV="$RUNNER_TEMP/prove" uv pip install -q --require-hashes -r requirements.txt
          VIRTUAL_ENV="$RUNNER_TEMP/prove" uv pip install -q --no-deps ./*.whl
          echo "$RUNNER_TEMP/prove/bin" >> "$GITHUB_PATH"
      # The worker records a strict build of every `make check` target under the commit and
      # publishes it with the seed.
      - name: Build and publish main's Lake outputs on prove
        run: |
          # shellcheck disable=SC2046 # one word per target
          hiloop-prove publish-build $(make -s scope)
