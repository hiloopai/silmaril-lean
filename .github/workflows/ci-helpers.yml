name: CI helpers

on:
  workflow_call:

permissions:
  contents: read

jobs:
  helpers:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record public runner capacity
        run: |
          nproc
          free -m
          df -h .
      - name: Test the CI time guard
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
