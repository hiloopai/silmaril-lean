name: Lean and native checks

on:
  workflow_call:
    inputs:
      seed:
        type: boolean
        default: false
        description: Allow a manual cache seed to finish a cold build

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.seed && 90 || 15 }}
    permissions:
      contents: read
      # GitHub OIDC for the shared Lean CAS roles (hiloop live/aws-foundation/lean-cas.tf).
      id-token: write
    env:
      # Public Linux runners have four cores and 16 GB RAM.
      LEAN_NUM_THREADS: 2
      LAKE_CI_BUCKET: hiloop-lean-cas-607856468300-us-east-1
      AWS_REGION: us-east-1
      # Every Lake run reads and fills the one artifact cache the pool restores into.
      LAKE_CACHE_DIR: ${{ github.workspace }}/.lake/cache
      LAKE_ARTIFACT_CACHE: 'true'
      # Main pushes and main seeds publish; every other run reads.
      CACHE_PUBLISH: >-
        ${{ github.repository == 'hiloopai/silmaril-lean' && github.ref == 'refs/heads/main' &&
            (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.seed)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # `cov-lake-cache get` restores the nearest of 64 first-parent ancestors
          # that main published; a shallower checkout cannot see them.
          fetch-depth: 65
      - name: Record runner capacity
        run: |
          nproc
          free -m
          df -h .
      - name: Install Lean
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
          use-github-cache: "false"
      - name: Install independent Wasm execution oracle
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install the shared Lake cache
        uses: ./.github/actions/lake-cache-tool
      - name: Assume the Lean CAS role
        id: credentials
        # Fork pull requests receive no OIDC token; they build without the pool.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::607856468300:role/gha-silmaril-lean-${{ env.CACHE_PUBLISH == 'true' && 'write' || 'read' }}-lean-cas
          aws-region: us-east-1
          role-duration-seconds: 7200
      - name: Restore from the shared Lake pool
        # The pool needs credentials; fork pull requests build instead.
        if: steps.credentials.outcome == 'success'
        run: make cache
      - name: Build all Lean modules and run every native release check
        env:
          LAKE_CACHE_RECORD: ${{ env.CACHE_PUBLISH == 'true' && 'build/lake-cache' || '' }}
        run: |
          du -sh .lake
          df -h .
          /usr/bin/time -v make check
          build/bin/sil --help
          build/bin/sil wasm opt --print-presets
      - name: Publish successful main artifacts to S3
        if: env.CACHE_PUBLISH == 'true'
        run: cov-lake-cache put --repository hiloopai/silmaril-lean
      - name: Retain native check results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wasm-release-checks
          path: build/wasm-checks.json
          if-no-files-found: ignore
          retention-days: 7
