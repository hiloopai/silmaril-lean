name: Lean and native checks

on:
  workflow_call:
    inputs:
      seed:
        type: boolean
        default: false
        description: Allow a manual cache seed to finish a cold build

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.seed && 90 || 15 }}
    permissions:
      contents: read
      # GitHub OIDC for the shared Lean CAS roles (hiloop live/aws-foundation/lean-cas.tf).
      id-token: write
    env:
      # Public Linux runners have four cores and 16 GB RAM.
      LEAN_NUM_THREADS: 2
      LAKE_CI_BUCKET: hiloop-lean-cas-607856468300-us-east-1
      LAKE_CI_PREFIX: silmaril-lean/lake
      AWS_REGION: us-east-1
      # Only main pushes publish; every other run reads.
      CACHE_PUBLISH: ${{ github.repository == 'hiloopai/silmaril-lean' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record runner capacity
        run: |
          nproc
          free -m
          df -h .
      - name: Restore build tree from disk cache
        id: disk
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake
          key: lake-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: lake-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-
      - name: Install Lean
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
          use-github-cache: "false"
      - name: Install independent Wasm execution oracle
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install the shared Lake cache
        uses: ./.github/actions/lake-cache-tool
      - name: Assume the Lean CAS role
        id: credentials
        # Fork pull requests receive no OIDC token; they use the disk cache or build.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::607856468300:role/gha-silmaril-lean-${{ env.CACHE_PUBLISH == 'true' && 'write' || 'read' }}-lean-cas
          aws-region: us-east-1
          role-duration-seconds: 7200
      - name: Fetch public dependency artifacts on a disk miss
        if: steps.disk.outputs.cache-matched-key == ''
        run: cov-lake-cache dependencies
      - name: Fill missing build artifacts from the optional S3 cache
        # Lake validates current sources when it unpacks restored artifacts.
        if: steps.disk.outputs.cache-matched-key == '' && steps.credentials.outcome == 'success'
        continue-on-error: true
        run: cov-lake-cache get --repository hiloopai/silmaril-lean
      - name: Build all Lean modules and run every native release check
        env:
          LAKE_CACHE_RECORD: ${{ env.CACHE_PUBLISH == 'true' && steps.disk.outputs.cache-hit != 'true' && 'build/lake-cache/root' || '' }}
        run: |
          du -sh .lake
          df -h .
          /usr/bin/time -v make check
          build/bin/sil --help
          build/bin/sil wasm opt --print-presets
      - name: Publish successful main artifacts to S3
        if: env.CACHE_PUBLISH == 'true' && steps.disk.outputs.cache-hit != 'true'
        continue-on-error: true
        run: cov-lake-cache put --repository hiloopai/silmaril-lean
      - name: Save successful main build or manual branch seed
        if: >-
          github.repository == 'hiloopai/silmaril-lean' && steps.disk.outputs.cache-hit != 'true' &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
           (github.event_name == 'workflow_dispatch' && inputs.seed))
        # GitHub scopes a manual seed to its triggering ref. Other branches
        # cannot replace a main cache entry, even when the key is identical.
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake
          key: ${{ steps.disk.outputs.cache-primary-key }}
      - name: Retain native check results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wasm-release-checks
          path: build/wasm-checks.json
          if-no-files-found: ignore
          retention-days: 7
