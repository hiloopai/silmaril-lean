name: Development environments

on:
  workflow_call:

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build developer image with optional tools
        run: docker build -f .devcontainer/Dockerfile --target cross-test -t silmaril-dev .
      - name: Check Lean, native compiler, Python, Node and reference tools
        run: docker run --rm -v "$PWD:/workspaces/silmaril:ro" silmaril-dev sh .devcontainer/smoke-test.sh --cross-test

  nix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@d9186cbdca7adedf113a159fa91f725a27866771 # v31
      - name: Check the shell with optional cross-testing tools
        run: nix develop .#cross-test --command sh .devcontainer/smoke-test.sh --cross-test
