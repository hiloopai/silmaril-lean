name: CI time budget

on:
  workflow_call:

permissions:
  actions: read
  contents: read

jobs:
  budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail separately if this CI attempt exceeds four minutes outside module compilation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          attempt="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          gh api "$attempt" > "$RUNNER_TEMP/ci-run.json"
          # The finished jobs' logs give the time Lake spent compiling, which does not count.
          mkdir -p "$RUNNER_TEMP/logs"
          for job in $(gh api --paginate "$attempt/jobs" --jq '.jobs[] | select(.status == "completed") | .id'); do
            gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$job/logs" > "$RUNNER_TEMP/logs/$job.txt"
          done
          python3 scripts/check-ci-time.py "$RUNNER_TEMP/ci-run.json" "$RUNNER_TEMP"/logs/*.txt
