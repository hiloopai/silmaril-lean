name: Wasm toolkit

on:
  push:
    branches: [main]
    paths: ['Silmaril/**', 'Silmaril.lean', 'tools/**', 'scripts/**', 'lake*', 'lean-toolchain', 'Makefile', '.github/workflows/wasm-toolkit.yml']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['Silmaril/**', 'Silmaril.lean', 'tools/**', 'scripts/**', 'lake*', 'lean-toolchain', 'Makefile', '.github/workflows/wasm-toolkit.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasm-toolkit-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Wasm native tools and proof roots
    if: ${{ !github.event.pull_request.draft }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 120
    environment:
      name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'hiloopai/silmaril-lean' && 'artifact-cache-publish' || 'artifact-cache-read' }}
    env:
      LEAN_NUM_THREADS: 4
      SILMARIL_CACHE_ENDPOINT: ${{ vars.SILMARIL_CACHE_ENDPOINT }}
      SILMARIL_CACHE_BUCKET: ${{ vars.SILMARIL_CACHE_BUCKET || 'lean-cache' }}
      SILMARIL_CACHE_PREFIX: ${{ vars.SILMARIL_CACHE_PREFIX || 'silmaril-lean/v1' }}
      SILMARIL_CACHE_REGION: ${{ vars.SILMARIL_CACHE_REGION || 'auto' }}
      SILMARIL_CACHE_PUBLIC_URL: ${{ vars.SILMARIL_CACHE_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 100
      - name: Install Lean
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
          use-github-cache: "false"
      - name: Install independent Wasm execution oracle
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Test the artifact cache helper
        run: python3 -m unittest discover -s scripts -p test_lake_cache.py
      - name: Fetch public dependency artifacts
        run: lake exe cache get
      - name: Restore optional S3 build artifacts
        continue-on-error: true
        env:
          SILMARIL_CACHE_READ_KEY: ${{ secrets.SILMARIL_CACHE_READ_KEY }}
          SILMARIL_CACHE_KEY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.SILMARIL_CACHE_KEY || '' }}
        run: python3 scripts/lake-cache.py get
      - name: Compile tools and proof roots, then exercise native regressions
        run: |
          make check
          build/bin/sil --help
          build/bin/sil wasm opt --print-presets
      - name: Publish successful main build artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'hiloopai/silmaril-lean'
        continue-on-error: true
        env:
          SILMARIL_CACHE_KEY: ${{ secrets.SILMARIL_CACHE_KEY }}
        run: python3 scripts/lake-cache.py put
      - name: Retain check results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wasm-release-checks
          path: build/wasm-checks.json
