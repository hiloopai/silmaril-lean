name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Lean build
    # Drafts skip the build; marking a pull request ready starts it.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Lean
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
          use-github-cache: "false"
      - name: Fetch Mathlib artifacts
        run: lake exe cache get
      - name: Build (warnings, including sorry, are errors)
        run: lake build --wfail
      - name: Check the layout rules
        run: scripts/check-layout.sh
