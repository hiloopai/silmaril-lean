name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      seed:
        description: Run a bounded cold build and seed this branch's cache
        type: boolean
        default: false

permissions:
  contents: read

# A pull request's new push cancels its running CI. On main a running publish is
# never cancelled: later pushes wait, and GitHub keeps only the newest waiting run,
# which publishes everything the skipped ones merged.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      lean: ${{ steps.paths.outputs.lean }}
      probes: ${{ steps.paths.outputs.probes }}
      environments: ${{ steps.paths.outputs.environments }}
      rust: ${{ steps.paths.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@15192bc058cc28a13dbf6cde61f19e18988b7af6 # v3
        id: paths
        with:
          filters: .github/paths-filter.yml

  helpers:
    uses: ./.github/workflows/ci-helpers.yml

  lean:
    needs: changes
    if: >-
      !github.event.pull_request.draft &&
      (needs.changes.outputs.lean == 'true' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/ci-lean.yml
    permissions:
      contents: read
      id-token: write
    with:
      seed: ${{ github.event_name == 'workflow_dispatch' && inputs.seed }}

  probes:
    needs: changes
    if: needs.changes.outputs.probes == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/lps-probes.yml

  environments:
    needs: changes
    if: needs.changes.outputs.environments == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/development-environments.yml

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci-rust.yml

  result:
    name: CI
    needs: [changes, helpers, lean, probes, environments, rust]
    if: always() && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every selected check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          jq -e '
            . as $jobs |
            .changes.result == "success" and .helpers.result == "success" and
            all(["lean", "probes", "environments", "rust"][]; . as $name |
              if $jobs.changes.outputs[$name] == "true" or env.FORCE_ALL == "true"
              then $jobs[$name].result == "success"
              else $jobs[$name].result == "skipped" or $jobs[$name].result == "success"
              end)
          ' <<< "$RESULTS"

  time-budget:
    name: CI time budget
    needs: result
    if: >-
      always() && !github.event.pull_request.draft &&
      !(github.event_name == 'workflow_dispatch' && inputs.seed)
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/ci-time-budget.yml
