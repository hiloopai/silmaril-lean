# Keep all build inputs here, including fixtures consumed by make check.
lean:
  - 'Silmaril/**'
  - '*.lean'
  - 'tools/**'
  - 'scripts/**'
  - 'apps/**'
  - 'examples/**'
  - 'data/**'
  - 'problems/**'
  - 'specs/**'
  - '.process-promotion.json'
  - 'lake*'
  - 'lean-toolchain'
  - 'Makefile'
  - 'regions.toml'
  - 'policy.toml'
  - '.github/**'

probes:
  - 'Silmaril/Process/LPS/Probes/**'
  - 'tools/verification-projects/*lps_probes*'
  - 'examples/verification-projects/theorem-dev/lps-probes/**'
  - '.github/**'

environments:
  - '.devcontainer/**'
  - '.dockerignore'
  - 'flake.nix'
  - 'flake.lock'
  - 'lean-toolchain'
  - 'Makefile'
  - 'scripts/sil'
  - '.github/**'

rust:
  - 'tools/silmaril-project/**'
  # read by the crate's tests (include_str!): the Lean load order and the records JSON Schema
  - 'Silmaril/Project/Registry/Load/Defs.lean'
  - 'docs/schemas/**'
  - '.github/**'
