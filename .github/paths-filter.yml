# Keep all build inputs here, including fixtures consumed by make check.
lean:
  - 'Silmaril/**'
  - '*.lean'
  - 'tools/**'
  - 'scripts/**'
  - 'apps/**'
  - 'examples/**'
  - 'data/**'
  - 'problems/**'
  - 'silmaril/**'
  - 'silmaril.toml'
  - 'specs/**'
  - '.process-promotion.json'
  - 'lake*'
  - 'lean-toolchain'
  - 'Makefile'
  - 'regions.toml'
  - 'policy.toml'
  - '.github/**'

probes:
  - 'Silmaril/Process/LPS/Probes/**'
  - 'tools/verification-projects/*lps_probes*'
  - 'examples/verification-projects/theorem-dev/lps-probes/**'
  - '.github/**'

environments:
  - '.devcontainer/**'
  - '.dockerignore'
  - 'flake.nix'
  - 'flake.lock'
  - 'lean-toolchain'
  - 'Makefile'
  - 'scripts/sil'
  - '.github/**'

rust:
  - 'tools/silmaril-project/**'
  # read by the crate's tests (include_str!): the Lean load order and the records JSON Schema
  - 'Silmaril/Project/Registry/Load/Defs.lean'
  - 'docs/schemas/**'
  - '.github/**'

# What `make project-registry` reads: the project manifest, registry and records, the Lake
# manifests `sil project` loads, the files the registry names, and the tool itself.
project:
  - 'silmaril.toml'
  - 'examples/wasm-components/**'
  - 'Silmaril/Project/WasmComponents/**'
  - 'Silmaril/Wasm/Component/Binary/Example/**'
  - 'tests/wat/fixtures/**'
  - 'silmaril/**'
  - 'lakefile.toml'
  - 'lake-manifest.json'
  - 'examples/project/**'
  - 'examples/project-formats/**'
  - 'examples/compiles-to/**'
  - 'examples/sysv-tv/**'
  - 'tools/silmaril-project/**'
  - 'Makefile'
  - '.github/**'
