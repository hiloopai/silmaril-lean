# Regions: the core subprojects of Silmaril. Each region owns
# `Silmaril/<Region>/…` (headers), `Silmaril/Proofs/<Region>/…` and
# `Silmaril/Raw/<Region>/…`. A region may import only itself and the regions
# in its `deps`. This is the intended dependency map;
# regions receive modules through individually reviewed additions.

[[region]]
name = "Prelude"
scope = "Small shared definitions: byte arrays, options, list utilities, attributes."
deps = []

[[region]]
name = "Semantics"
scope = "Semantic toolkit: domains, category theory, Elgot iteration, binding, traces, simulation, behaviours."
deps = ["Prelude"]

[[region]]
name = "Logic"
scope = "Logics and metatheory: theories and models, HOL, Metamath, set theory, arithmetic."
deps = ["Prelude", "Semantics"]

[[region]]
name = "Computability"
scope = "Complexity classes, machines, oracle constructions, problem encodings."
deps = ["Prelude", "Semantics", "Logic"]

[[region]]
name = "Numeric"
scope = "IEEE 754, integers, ball arithmetic, numeric kernels."
deps = ["Prelude", "Semantics"]

[[region]]
name = "Crypto"
scope = "Hash functions, MACs, ciphers, signatures: specifications and properties."
deps = ["Prelude", "Semantics", "Numeric"]

[[region]]
name = "Formats"
scope = "Data formats and codecs: bytes, JSON, CBOR, S-expressions, ASN.1, ELF, compression."
deps = ["Prelude", "Semantics", "Numeric", "Crypto"]

[[region]]
name = "SSA"
scope = "SSA and effectful intermediate representations: syntax, typing, equational theory, denotations, refinement."
deps = ["Prelude", "Semantics", "Logic"]

[[region]]
name = "Calculi"
scope = "Small calculi and their semantics: lambda calculi, PCF, game semantics, Imp."
deps = ["Prelude", "Semantics", "Logic", "Formats", "SSA"]

[[region]]
name = "Machine"
scope = "Instruction sets (x86, RISC-V, AArch64), machine IRs, memory models, processes."
deps = ["Prelude", "Semantics", "Numeric", "Crypto", "Formats", "SSA"]

[[region]]
name = "Process"
scope = "Linux process semantics, ELF launch models, syscall tables, musl startup, and process-level demonstrations."
deps = ["Prelude", "Semantics", "Numeric", "Crypto", "Formats", "Machine"]

[[region]]
name = "Wasm"
scope = "WebAssembly: core specifications, component model, text and binary formats, lowering."
deps = ["Prelude", "Semantics", "Logic", "Numeric", "Crypto", "Formats", "SSA", "Machine", "Cli", "Games"]

[[region]]
name = "GPU"
scope = "GPU kernel languages and their correctness (Triton, Gluon)."
deps = ["Prelude", "Semantics", "Numeric", "SSA"]

[[region]]
name = "Languages"
scope = "Real-world languages: Python, C (Cerberus), MLIR."
deps = ["Prelude", "Semantics", "Numeric", "Formats", "SSA", "GPU"]

[[region]]
name = "Science"
scope = "Units, physical constants and other scientific world models."
deps = ["Prelude", "Numeric"]

[[region]]
name = "Elf"
scope = "The ELF verification API: one parse of an ELF64 file into an AST, symbol lookup as ld.so does it (SysV and GNU hash, versions), a lookup index, facts about a file (kind, symbols, lookups, DT_NEEDED, relocations, placement, code) with their problem shapes, a checker for the parse of large files, and the x86-64 dynamic-loading models these facts relate to (ld.so's table readers, pages of included files, ElfBind, the loader relation ExeLoaded and its image). Also imports the x86 tree (`Silmaril.X86`: blobs, memory, symbolic execution), which is not a region, as `Project` does."
deps = ["Prelude", "Formats", "Machine", "Process", "Project", "Cli"]

[[region]]
name = "Libc"
scope = "C library contracts: the contract institution of C library signatures (signatures, contracts with reducts, invariants as a monoidal category, the institution, the allocator chain and stdio, the tensor), the abstract allocator heap and its signature hierarchy, and allocator contracts over ELF shared objects with their loading model (segments at a page-aligned base, imports bound to functions with named contracts) and problem shapes; and allocators in static x86-64 executables (specifications, problem shapes, the pinned toy-allocator ladder and its proofs). Also imports the x86 tree (`Silmaril.X86`: relational machines, function contracts, the separation-logic allocator interface), which is not a region, as `Elf` does."
deps = ["Prelude", "Semantics", "Logic", "Formats", "Machine", "Process", "Elf", "Project"]

[[region]]
name = "Project"
scope = "Silmaril projects: artifact types, formats and values, problems over arguments, the problem DAG, records files, rooms, the standard shapes (formats and values, ELF executables, x86-64 functions, command-line programs) and format adapters over silmaril's parsers; the records `sil project` dumps and checks. Also imports the x86 tree (`Silmaril.X86`: function contracts, block certificates, the pinned ladder), `Silmaril.Problems` (core, model classes and shapes) and `Silmaril.Data` (the include-bytes helper); none of these is a region here, an existing exception to `deps`."
deps = ["Formats", "Logic", "Process", "Wasm", "Machine", "Cli"]

# Views are leaves: no region imports them. Papers, Standards and Thesis
# re-export and restate; Courses may include self-contained teaching proofs.
[[view]]
name = "Papers"
scope = "One folder per paper: Defs, Relations, Thms following the paper's numbering."

[[view]]
name = "Standards"
scope = "One folder per standard (RFCs, ISA manuals, the Wasm specification)."

[[view]]
name = "Thesis"
scope = "imbrem/thesis, one folder per chapter, following the text."

[[view]]
name = "Courses"
scope = "Self-contained course developments, with inline proofs and numbered references; imported by no library region."

[[region]]
name = "Cli"
scope = "Command-line interfaces as specifications: argument grammars as data with a derived front end (parser proved sound and complete, renderer with round trip, help, usage errors, exit codes, grammar morphisms), the clap and getopt dialects, a behaviour model of CLI programs (arguments, environment, stdin, stdout, stderr, files under declared roots, exit code) with refinement and composition, Lean programs as a free monad with a test harness, and the CLI institution with its observation levels and standard sentences. Also imports `Silmaril.Apps.Sha256sum` (the reference behaviour of `sha256sum`), which is not a region."
deps = ["Logic"]

[[region]]
name = "Games"
scope = "Game semantics for components that call effects: effect signatures, plays, strategies with refinement, parallel composition with hiding, handlers, transition systems as strategies, divergence and infinite plays, and instantiation and linking of components with failure."
deps = ["Prelude"]

[[region]]
name = "WasmSpec"
scope = "Functional specifications of example WebAssembly programs (adder, max, sum, insertion sort, B-tree) used by the verification benchmarks."
deps = ["Logic", "Wasm"]

[[region]]
name = "Parse"
scope = "Byte-level parsing: a combinator core for binary formats, with its laws, shared by the Wasm binary codecs and other formats."
deps = []
